<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TLC | My Profile</title>

    <link
        rel="stylesheet"
        href="/static/css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="/static/assets/responsive.css"
    >

    <style>

        .profile-page {
            min-height: 100vh;
            padding: 30px 18px 50px;
        }

        .profile-container {
            max-width: 950px;
            margin: 0 auto;
        }

        .profile-header {
            margin-bottom: 24px;
        }

        .profile-header h1 {
            margin: 0 0 6px;
        }

        .profile-header p {
            margin: 0;
            opacity: .75;
        }

        .profile-card {
            background: #ffffff;
            border: 1px solid #dce7f0;
            border-radius: 18px;
            overflow: hidden;
        }

        .profile-top {
            padding: 30px;
            background:
                linear-gradient(
                    135deg,
                    #12355b,
                    #173f6b
                );

            color: #ffffff;

            display: flex;
            align-items: center;
            gap: 24px;
        }

        .profile-photo-wrap {
            flex: 0 0 auto;
        }

        .profile-photo {

            width: 110px;
            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            border: 4px solid
                rgba(255, 255, 255, .85);

            background: #ffffff;

            display: none;
        }

        .profile-avatar {

            width: 110px;
            height: 110px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
            color: #12355b;

            font-size: 34px;
            font-weight: 900;

            border: 4px solid
                rgba(255, 255, 255, .85);
        }

        .profile-top h2 {
            margin: 0 0 7px;
            font-size: 25px;
        }

        .profile-top p {
            margin: 0;
            opacity: .85;
        }

        .profile-body {
            padding: 28px;
        }

        .profile-section-title {
            margin: 0 0 18px;
            color: #12355b;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }

        .profile-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }

        .profile-field {

            padding: 17px;

            border: 1px solid #e1eaf2;

            border-radius: 12px;

            background: #fbfdff;
        }

        .profile-field span {

            display: block;

            margin-bottom: 6px;

            color: #718396;

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;
        }

        .profile-field strong {

            display: block;

            color: #1c2d3d;

            font-size: 15px;

            overflow-wrap: anywhere;
        }

        .status-active {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            background: #e6f7ef;

            color: #137a4b;

            font-size: 12px;

            font-weight: 900;
        }

        .profile-actions {

            margin-top: 25px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }

        .profile-actions a {

            display: inline-block;

            padding: 11px 17px;

            border-radius: 10px;

            text-decoration: none;

            font-weight: 800;
        }


        .edit-profile-button {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 7px !important;

            min-height: 46px !important;
            padding: 0 18px !important;

            border: 0 !important;
            border-radius: 10px !important;

            background: #0b6efd !important;
            color: #ffffff !important;

            font-family: inherit !important;
            font-size: 14px !important;
            font-weight: 800 !important;

            line-height: 1 !important;

            cursor: pointer !important;
            pointer-events: auto !important;

            appearance: none !important;
            -webkit-appearance: none !important;

            box-sizing: border-box !important;

            transition:
                background .18s ease,
                transform .08s ease,
                box-shadow .18s ease !important;
        }

        .edit-profile-button:hover {
            background: #095dcc !important;
            box-shadow: 0 4px 12px rgba(11, 110, 253, .22) !important;
        }

        .edit-profile-button:active {
            transform: translateY(1px) !important;
        }

        .edit-profile-button:focus-visible {
            outline: 3px solid rgba(11, 110, 253, .35) !important;
            outline-offset: 2px !important;
        }

        .back-dashboard {

            background: #12355b;

            color: #ffffff;
        }

        .profile-message {

            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 10px;

            background: #fff4f2;

            color: #b42318;

            font-weight: 700;
        }

        @media (max-width: 650px) {

            .profile-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            .profile-body,
            .profile-top {
                padding: 20px;
            }

        }

    
        .edit-profile-panel {
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #dce7f0;
            border-radius: 15px;
            background: #f8fbff;
        }

        .edit-photo-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .edit-photo-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .choose-photo-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 16px;
            border-radius: 10px;
            background: #0b6efd;
            color: #ffffff;
            font-weight: 800;
            cursor: pointer;
        }

        .photo-help {
            margin: 0;
            color: #718396;
            font-size: 12px;
        }

        .edit-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .edit-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .edit-field span {
            color: #718396;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .edit-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 13px;
            border: 1px solid #d8e4ef;
            border-radius: 10px;
            background: #ffffff;
            color: #1c2d3d;
            font-size: 14px;
        }

        .edit-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .cancel-edit,
        .save-edit {
            min-height: 44px;
            padding: 0 17px;
            border: 0;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        .cancel-edit {
            background: #dce7f0;
            color: #17365d;
        }

        .save-edit {
            background: #0b6efd;
            color: #ffffff;
        }

        .edit-profile-message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 10px;
            background: #e6f7ef;
            color: #137a4b;
            font-weight: 700;
        }

        @media (max-width: 650px) {
            .edit-photo-area {
                flex-direction: column;
                align-items: flex-start;
            }

            .edit-grid {
                grid-template-columns: 1fr;
            }

            .edit-actions {
                flex-direction: column;
            }
        }

</style>

    <script src="/static/js/csrf.js"></script>
</head>


<body>


<main class="profile-page">

    <div class="profile-container">

        <div class="profile-header">

            <h1>
                My Profile
            </h1>

            <p>
                Your official THE LEGACY CIRCLE (TLC)
                membership information.
            </p>

        </div>


        <section
            class="profile-card"
            id="profileCard"
        >


            <div class="profile-top">


                <div class="profile-photo-wrap">

                    <div
                        id="profileAvatar"
                        class="profile-avatar"
                    >
                        —
                    </div>

                    <img
                        id="profilePhoto"
                        class="profile-photo"
                        alt="TLC member profile picture"
                    >

                </div>


                <div>

                    <h2 id="profileName">
                        —
                    </h2>

                    <p id="profileMemberId">
                        —
                    </p>

                </div>


            </div>


            <div class="profile-body">


                <h3 class="profile-section-title">
                    Member Information
                </h3>


                <div class="profile-grid">


                    <div class="profile-field">
                        <span>Full Name</span>
                        <strong id="fullName">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Member ID</span>
                        <strong id="memberId">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Phone Number</span>
                        <strong id="phone">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Email Address</span>
                        <strong id="email">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Membership Status</span>
                        <strong id="membershipStatus">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Registration Date</span>
                        <strong id="registrationDate">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Account Status</span>
                        <strong id="accountStatus">—</strong>
                    </div>


                    <div class="profile-field">
                        <span>Last Login</span>
                        <strong id="lastLogin">—</strong>
                    </div>


                </div>


                <div
                    id="profileMessage"
                    class="profile-message"
                ></div>


                
                <div
                    id="editProfilePanel"
                    class="edit-profile-panel"
                    hidden
                >

                    <h3 class="profile-section-title">
                        Edit Profile
                    </h3>

                    <form
                        id="editProfileForm"
                        enctype="multipart/form-data"
                    >

                        <div class="edit-photo-area">

                            <div class="edit-photo-preview">

                                <div
                                    id="editAvatar"
                                    class="profile-avatar"
                                >
                                    ?
                                </div>

                                <img
                                    id="editPhotoPreview"
                                    class="profile-photo"
                                    alt="Profile picture preview"
                                    hidden
                                >

                            </div>

                            <div class="edit-photo-controls">

                                <label
                                    for="profilePictureInput"
                                    class="choose-photo-button"
                                >
                                    Choose Photo
                                </label>

                                <input
                                    id="profilePictureInput"
                                    name="profile_picture"
                                    type="file"
                                    accept="image/jpeg,image/png,image/webp"
                                    hidden
                                >

                                <p class="photo-help">
                                    JPG, JPEG, PNG or WEBP
                                </p>

                            </div>

                        </div>

                        <div class="edit-grid">

                            <label class="edit-field">
                                <span>Full Name</span>
                                <input
                                    id="editFullName"
                                    name="full_name"
                                    type="text"
                                    required
                                >
                            </label>

                            <label class="edit-field">
                                <span>Phone Number</span>
                                <input
                                    id="editPhone"
                                    name="phone"
                                    type="tel"
                                    required
                                >
                            </label>

                            <label class="edit-field">
                                <span>Email Address</span>
                                <input
                                    id="editEmail"
                                    name="email"
                                    type="email"
                                    required
                                >
                            </label>

                        </div>

                        <div
                            id="editProfileMessage"
                            class="edit-profile-message"
                        ></div>

                        <div class="edit-actions">

                            <button
                                type="button"
                                id="cancelEditProfile"
                                class="cancel-edit"
                            >
                                Cancel
                            </button>

                            <button
                                type="submit"
                                id="saveProfileChanges"
                                class="save-edit"
                            >
                                Save Changes
                            </button>

                        </div>

                    </form>

                </div>

<div class="profile-actions">

                    <button
                        type="button"
                        id="editProfileButton"
                        class="edit-profile-button"
                        aria-label="Edit your TLC profile"
                        onclick="openEditProfile()"
                    >
                        ? Edit Profile
                    </button>


                    <a
                        href="/dashboard"
                        class="back-dashboard"
                    >
                        ← Back to Dashboard
                    </a>

                </div>


            </div>


        </section>


    </div>


</main>


<script>

let currentMember = null;


function setText(id, value) {

    const element =
        document.getElementById(id);

    if (!element) {
        return;
    }

    element.textContent =
        value === null ||
        value === undefined ||
        String(value).trim() === ""
            ? "?"
            : String(value);
}


function getInitials(name) {

    const text =
        String(name || "").trim();

    if (!text) {
        return "?";
    }

    const parts =
        text.split(/\s+/).filter(Boolean);

    if (parts.length === 1) {
        return parts[0]
            .substring(0, 2)
            .toUpperCase();
    }

    return (
        parts[0][0] +
        parts[parts.length - 1][0]
    ).toUpperCase();
}


function loadProfilePhoto(member) {

    const photo =
        document.getElementById(
            "profilePhoto"
        );

    const avatar =
        document.getElementById(
            "profileAvatar"
        );

    if (!photo || !avatar) {
        return;
    }

    avatar.textContent =
        getInitials(member.full_name);

    const picture =
        String(
            member.profile_picture || ""
        ).trim();

    if (!picture) {

        photo.style.display = "none";
        avatar.style.display = "flex";

        return;
    }

    const safeName =
        picture
            .split("\\")
            .pop()
            .split("/")
            .pop();

    if (!safeName) {
        return;
    }

    const imageUrl =
        "/media/profile_pictures/" +
        encodeURIComponent(safeName);

    photo.onload = function () {

        photo.style.display = "block";
        avatar.style.display = "none";
    };

    photo.onerror = function () {

        photo.style.display = "none";
        avatar.style.display = "flex";
    };

    photo.src = imageUrl;
}


async function loadProfile() {

    const message =
        document.getElementById(
            "profileMessage"
        );

    try {

        const response =
            await fetch(
                "/api/member/profile",
                {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                "Unable to load your profile."
            );
        }

        const member =
            data.member;

        currentMember =
            member;

        setText(
            "profileName",
            member.full_name
        );

        setText(
            "profileMemberId",
            member.member_id
        );

        setText(
            "fullName",
            member.full_name
        );

        setText(
            "memberId",
            member.member_id
        );

        setText(
            "phone",
            member.phone
        );

        setText(
            "email",
            member.email
        );

        setText(
            "membershipStatus",
            member.membership_status
        );

        setText(
            "registrationDate",
            member.registration_date
        );

        setText(
            "lastLogin",
            member.last_login
        );

        const accountStatus =
            document.getElementById(
                "accountStatus"
            );

        if (accountStatus) {

            accountStatus.textContent =
                member.account_status || "?";

            if (
                String(
                    member.account_status || ""
                ).toLowerCase() === "active"
            ) {

                accountStatus.className =
                    "status-active";
            }
        }

        loadProfilePhoto(member);

    } catch (error) {

        if (message) {

            message.style.display =
                "block";

            message.textContent =
                error.message;
        }

        console.error(
            "TLC PROFILE ERROR:",
            error
        );
    }
}


function openEditProfile() {

    if (!currentMember) {
        return;
    }

    const panel =
        document.getElementById(
            "editProfilePanel"
        );

    if (!panel) {
        return;
    }

    const fullName =
        document.getElementById(
            "editFullName"
        );

    const phone =
        document.getElementById(
            "editPhone"
        );

    const email =
        document.getElementById(
            "editEmail"
        );

    if (fullName) {
        fullName.value =
            currentMember.full_name || "";
    }

    if (phone) {
        phone.value =
            currentMember.phone || "";
    }

    if (email) {
        email.value =
            currentMember.email || "";
    }

    const avatar =
        document.getElementById(
            "editAvatar"
        );

    const preview =
        document.getElementById(
            "editPhotoPreview"
        );

    if (avatar) {

        avatar.textContent =
            getInitials(
                currentMember.full_name
            );

        avatar.style.display = "flex";
    }

    if (
        preview &&
        currentMember.profile_picture
    ) {

        preview.src =
            "/media/profile_pictures/" +
            encodeURIComponent(
                currentMember.profile_picture
            );

        preview.hidden = false;

        if (avatar) {
            avatar.style.display = "none";
        }
    }

    panel.hidden = false;

    panel.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}


function closeEditProfile() {

    const panel =
        document.getElementById(
            "editProfilePanel"
        );

    if (panel) {
        panel.hidden = true;
    }

    const input =
        document.getElementById(
            "profilePictureInput"
        );

    if (input) {
        input.value = "";
    }
}


function setupEditProfile() {

    const editButton =
        document.getElementById(
            "editProfileButton"
        );

    if (editButton) {

        editButton.addEventListener(
            "click",
            openEditProfile
        );
    }


    const cancelButton =
        document.getElementById(
            "cancelEditProfile"
        );

    if (cancelButton) {

        cancelButton.addEventListener(
            "click",
            closeEditProfile
        );
    }


    const pictureInput =
        document.getElementById(
            "profilePictureInput"
        );

    if (pictureInput) {

        pictureInput.addEventListener(
            "change",
            function () {

                const file =
                    this.files &&
                    this.files[0];

                if (!file) {
                    return;
                }

                const allowedTypes = [
                    "image/jpeg",
                    "image/png",
                    "image/webp"
                ];

                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    this.value = "";

                    alert(
                        "Please choose a JPG, PNG or WEBP image."
                    );

                    return;
                }

                const reader =
                    new FileReader();

                reader.onload = function (
                    event
                ) {

                    const preview =
                        document.getElementById(
                            "editPhotoPreview"
                        );

                    const avatar =
                        document.getElementById(
                            "editAvatar"
                        );

                    if (preview) {

                        preview.src =
                            event.target.result;

                        preview.hidden =
                            false;
                    }

                    if (avatar) {

                        avatar.style.display =
                            "none";
                    }
                };

                reader.readAsDataURL(file);
            }
        );
    }


    const form =
        document.getElementById(
            "editProfileForm"
        );

    if (form) {

        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                const message =
                    document.getElementById(
                        "editProfileMessage"
                    );

                const button =
                    document.getElementById(
                        "saveProfileChanges"
                    );

                const formData =
                    new FormData(this);

                if (button) {

                    button.disabled = true;
                    button.textContent =
                        "Saving...";
                }

                try {

                    const response =
                        await fetch(
                            "/api/member/profile/update",
                            {
                                method: "POST",
                                credentials: "same-origin",
                                body: formData
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        throw new Error(
                            data.message ||
                            "Unable to update your profile."
                        );
                    }

                    currentMember =
                        data.member;

                    if (message) {

                        message.style.display =
                            "block";

                        message.style.background =
                            "#e6f7ef";

                        message.style.color =
                            "#137a4b";

                        message.textContent =
                            data.message;
                    }

                    await loadProfile();

                    setTimeout(
                        closeEditProfile,
                        900
                    );

                } catch (error) {

                    if (message) {

                        message.style.display =
                            "block";

                        message.style.background =
                            "#fff4f2";

                        message.style.color =
                            "#b42318";

                        message.textContent =
                            error.message;
                    }

                    console.error(
                        "TLC PROFILE UPDATE ERROR:",
                        error
                    );

                } finally {

                    if (button) {

                        button.disabled = false;

                        button.textContent =
                            "Save Changes";
                    }
                }
            }
        );
    }
}


const editProfileButton =
    document.getElementById(
        "editProfileButton"
    );

if (editProfileButton) {
    editProfileButton.addEventListener(
        "click",
        openEditProfile
    );
}

setupEditProfile();
loadProfile();

</script>


</body>

</html>
