<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC | Activate Account</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/assets/responsive.css">`r`n</head>
<body>

<div class="login-page">
    <div class="login-card">

        <div class="logo-area">
            <img src="/static/assets/tlc_logo.jpeg" alt="TLC Logo">
        </div>

        <h1>THE LEGACY CIRCLE</h1>
        <p class="subtitle">ACCOUNT ACTIVATION</p>

        <div class="welcome">
            <h2>Activate Your Account</h2>
            <p>Enter the details registered with TLC.</p>
        </div>

        <form id="activationForm">

            <label for="memberId">Member ID</label>
            <input type="text" id="memberId"
                   placeholder="Enter your Member ID" required>

            <label for="phone">Registered Phone Number</label>
            <input type="text" id="phone"
                   placeholder="Enter your registered phone number" required>

            <button type="submit" class="login-submit">
                VERIFY ACCOUNT
            </button>

            <div id="activationMessage"></div>

        </form>

        <div class="footer">
            <p>THE LEGACY CIRCLE (TLC)</p>
            <span>© 2026 All Rights Reserved.</span>
            <strong>Powered by THEE ALVIN TECH SOLUTIONS</strong>
        </div>

    </div>
</div>

<script src="/static/js/activation.js"></script>

</body>
</html>
