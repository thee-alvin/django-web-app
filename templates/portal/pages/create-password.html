<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLC | Create Password</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/assets/responsive.css">`r`n    <script src="/static/js/csrf.js"></script>
</head>

<body>

<div class="login-page">
    <div class="login-card">

        <div class="logo-area">
            <img src="/static/assets/tlc_logo.jpeg" alt="TLC Logo">
        </div>

        <h1>THE LEGACY CIRCLE</h1>
        <p class="subtitle">ACCOUNT SETUP</p>

        <div class="welcome">
            <h2>Create Your Password</h2>
            <p>Your TLC account has been verified.</p>
        </div>

        <form id="passwordForm">

            <label for="newPassword">Create Password</label>
            <input
                type="password"
                id="newPassword"
                placeholder="Create a secure password"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter your password again"
                required
            >

            <button type="submit" class="login-submit">
                ACTIVATE ACCOUNT
            </button>

            <div id="passwordMessage"></div>

        </form>

        <div class="security">
            🔒 Your password will be securely protected.
        </div>

        <div class="footer">
            <p>THE LEGACY CIRCLE (TLC)</p>
            <span>© 2026 All Rights Reserved.</span>
            <strong>Powered by THEE ALVIN TECH SOLUTIONS</strong>
        </div>

    </div>
</div>

<script src="/static/js/password.js"></script>

</body>
</html>
